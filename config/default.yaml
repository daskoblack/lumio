# Configuration par défaut de Lectio.
# Aucune valeur de durée arbitraire : les durées viennent du calcul (mots / débit)
# ou de l'utilisateur. Le débit lui-même est calibré après TTS (phase 3).

language: fr

providers:
  llm:
    # Fournisseur principal, puis chaîne de repli automatique : quand un
    # fournisseur épuise son quota du jour (Groq : 100 000 tokens/jour), la
    # génération continue sur le maillon suivant au lieu d'échouer.
    # Un maillon dont la clé API n'est pas renseignée est simplement ignoré.
    name: groq
    model: openai/gpt-oss-120b       # modèle principal (le plus capable)
    temperature: 0.4
    max_document_chars: 24000        # budget de l'analyse (extrait de CHAQUE page)
    min_interval_s: 2.0              # espacement minimal entre appels (évite les 429)
    fallbacks:
      - name: groq                   # même compte, modèle plus léger
        model: openai/gpt-oss-20b
      - name: cerebras               # 1 000 000 tokens/jour gratuits
        model: gpt-oss-120b
      - name: gemini                 # ~10 requêtes/min en gratuit -> espacement plus large
        model: gemini-2.5-flash-lite
        min_interval_s: 6.5
      - name: mistral
        model: mistral-small-latest

  tts:
    # Groq (PlayAI) ne supporte pas le français : edge-tts (gratuit, sans clé,
    # voix neurales) est utilisé par défaut. Changeable via cette interface.
    name: edge
    voice: fr-FR-DeniseNeural         # voix par défaut (fr-FR-HenriNeural en alternative)

  stt:
    name: groq
    model: whisper-large-v3-turbo     # transcription multilingue, timestamps mot-à-mot
    min_interval_s: 2.0               # même compte Groq que le LLM : même précaution

voice:
  # Débit initial en mots/seconde (~140 mots/min pour du FR).
  # Valeur de départ uniquement : recalibrée par voix après chaque TTS.
  default_speech_rate_wps: 2.3

scripting:
  word_budget_tolerance: 0.05        # fourchette ±5% tolérée avant correction texte (cible EXPLICITE)
  auto_overshoot_tolerance: 0.30     # idem, mais pour une cible AUTO (simple plafond, pas un ordre précis)
  min_words_per_page: 70             # plancher absolu par page, quel que soit N pages dans la section
  max_generation_passes: 4           # boucle bornée : 1 génération + jusqu'à 3 corrections (cible EXPLICITE)

synthesis:
  # Écart |réel - cible| / cible déclenchant une re-synthèse (cible EXPLICITE).
  deviation_threshold: 0.08

slides:
  width: 1920
  height: 1080

subtitles:
  # Conventions standard de sous-titrage (pas une durée pédagogique arbitraire).
  max_chars_per_line: 42
  max_lines: 2
  max_words_per_caption: 14

paths:
  workspace: workspace
