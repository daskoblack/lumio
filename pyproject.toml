[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lectio"
version = "0.1.0"
description = "Transforme un PDF pédagogique en vidéo de cours avec un professeur IA"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "pymupdf>=1.24",   # extraction PDF (texte + images + layout)
    "groq>=0.11",      # fournisseur LLM + Whisper (STT), gratuit
    "cerebras_cloud_sdk>=1.0",  # fournisseur LLM alternatif, gratuit (quota/jour bien plus large)
    "edge-tts>=6.1",   # TTS gratuit, sans clé, voix neurales FR (Groq TTS ne fait pas le français)
    "pillow>=10.0",    # rendu des slides en images (léger, pas de navigateur à installer)
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
desktop = ["pywebview>=6.0"]  # app desktop Lumio (pywebview + frontend React)

[project.scripts]
lectio = "lectio.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["lectio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
